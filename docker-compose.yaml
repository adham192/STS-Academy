services:
  postgres:
    image: postgres:latest
    container_name: chatbot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host port -> container port. Optional: only needed to connect from your machine (pgAdmin, psql).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: chatbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    image: apis-sts:latest
    container_name: chatbot-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Service names (postgres, redis) are the hostnames; ports are the INTERNAL ones.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    extra_hosts:
      # Lets the container reach Ollama running on your machine
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy   # wait until Postgres actually accepts connections
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata: